# The service's own settings come from DRAWBARLINE_* environment variables through Settings, and the
# database is handed to the application when it starts. What is here is only how Spring itself
# should behave.
spring.application.name=drawbarline
spring.main.banner-mode=off
spring.mvc.format.date=iso
spring.mvc.format.date-time=iso
server.error.whitelabel.enabled=false
springdoc.api-docs.enabled=true
springdoc.api-docs.path=/openapi.json
springdoc.api-docs.version=openapi_3_1
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/docs
