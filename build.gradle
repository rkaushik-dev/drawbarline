plugins {
	id 'java'
	id 'application'
	id 'jacoco'
	id 'com.diffplug.spotless' version '7.0.4'
	id 'org.springframework.boot' version '3.5.16'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'io.github.rkaushikdev'
version = '0.1.0'
description = 'Car hire, demurrage and interchange settlement for a short line railroad'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	// The command line opens the books without starting the service, so it builds its entity
	// manager factory from spring-orm and Hibernate directly; Boot's own wiring is switched off.
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.flywaydb:flyway-core'
	implementation 'com.h2database:h2'
	implementation 'info.picocli:picocli:4.7.7'
	// Logs configures Logback itself rather than through Boot.
	implementation 'org.springframework.boot:spring-boot-starter-logging'
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.17'

	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'
	// Exceptions here are never serialized, so serial lint is noise; annotation processors on
	// the classpath warn about annotations nobody claims.
	options.compilerArgs.addAll([
		'-Xlint:all,-serial,-processing',
		'-Werror'
	])
}

application {
	mainClass = 'io.github.rkaushikdev.drawbarline.cli.Main'
	applicationName = 'drawbarline'
}

springBoot {
	// The jar runs the command line; only `drawbarline serve` starts the service.
	mainClass = application.mainClass
}

// Every jar the build makes, the plain one the distribution runs and the Boot jar alike, says what
// it is, which release it is and under what licence it ships.
tasks.withType(Jar).configureEach {
	manifest {
		attributes(
				'Implementation-Title': project.name,
				'Implementation-Version': project.version,
				'Implementation-Vendor': 'rkaushik-dev',
				'Implementation-URL': 'https://github.com/rkaushik-dev/drawbarline',
				'License': 'Proprietary'
				)
	}
}

tasks.named('test', Test) {
	useJUnitPlatform()
	// The build, workflow and source checks read files relative to the project root, and they read
	// these files as text, so a change to one of them has to run the suite again.
	workingDir = projectDir
	inputs.files('build.gradle', 'settings.gradle', 'README.md', '.github/workflows/ci.yml',
			'gradle/wrapper/gradle-wrapper.properties')
			.withPropertyName('projectFiles')
			.withPathSensitivity(PathSensitivity.RELATIVE)
	inputs.files(fileTree('src/main/java'), fileTree('src/test/java'))
			.withPropertyName('sources')
			.withPathSensitivity(PathSensitivity.RELATIVE)
	maxParallelForks = 1
	maxHeapSize = '1g'
	// Mockito's agent appends to the boot class path; without class-data sharing the JVM has
	// nothing to warn about.
	jvmArgs '-Xshare:off'
	testLogging {
		events 'failed'
		exceptionFormat = 'full'
	}
	finalizedBy tasks.named('jacocoTestReport')
}

jacoco {
	toolVersion = '0.8.13'
}

tasks.named('jacocoTestReport', JacocoReport) {
	dependsOn tasks.named('test')
	// Coverage is of the application, never of the suite measuring it.
	sourceSets sourceSets.main
	reports {
		xml.required = true
		html.required = true
	}
}

tasks.named('jacocoTestCoverageVerification', JacocoCoverageVerification) {
	dependsOn tasks.named('test')
	sourceSets sourceSets.main
	// The floors sit just under where the suite has been since the persistence layer landed, so
	// losing real coverage fails the build rather than drifting. They live here and nowhere else,
	// so the number is the same in the workflow and on a desk.
	violationRules {
		rule {
			limit {
				counter = 'LINE'
				value = 'COVEREDRATIO'
				minimum = 0.90
			}
			limit {
				counter = 'BRANCH'
				value = 'COVEREDRATIO'
				minimum = 0.80
			}
		}
	}
}

tasks.named('check') {
	dependsOn tasks.named('jacocoTestCoverageVerification')
}

spotless {
	java {
		target 'src/**/*.java'
		palantirJavaFormat()
		removeUnusedImports()
		trimTrailingWhitespace()
		endWithNewline()
	}
	groovyGradle {
		target '*.gradle'
		greclipse()
	}
}
