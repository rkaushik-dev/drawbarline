[build-system]
requires = ["setuptools>=75.8.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "drawbarline"
version = "0.1.0"
description = "Car hire, demurrage and interchange settlement for a short line railroad"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "rkaushik-dev" }]
dependencies = [
  # zoneinfo reads the operating system database, which windows does not have.
  # Every hour we bill is local time at a station, so this is not optional there.
  "tzdata==2025.1 ; sys_platform == 'win32'",
  "SQLAlchemy==2.0.38",
  "alembic==1.14.1",
  "click==8.1.8",
  "fastapi==0.115.8",
  "pydantic==2.10.6",
  "uvicorn[standard]==0.34.0",
]

[project.scripts]
drawbarline = "drawbarline.cli:run"

[project.optional-dependencies]
dev = [
  "pytest==8.3.4",
  "httpx==0.28.1",
  "pytest-xdist==3.6.1",
  "pytest-cov==6.0.0",
  "ruff==0.9.6",
  "mypy==1.15.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# The marker tells anybody importing this package that the annotations are
# real and can be checked against. Without it the types are ignored.
drawbarline = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
addopts = "-q -n auto --dist loadfile"
filterwarnings = [
  # Starlette's test client still reaches for an anyio alias anyio has
  # deprecated. Not ours to fix and not worth reading on every run.
  "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning",
]

[tool.coverage.run]
source = ["drawbarline"]
branch = true
# The workers each write their own file and they are combined afterwards.
parallel = true
concurrency = ["multiprocessing"]

[tool.coverage.report]
# The suite has covered everything but a handful of defensive branches since
# the persistence layer landed. The floor is set just under where it sits so
# that losing real coverage fails rather than drifting.
fail_under = 95
show_missing = true
skip_covered = true
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "C4", "SIM", "RET"]

[tool.ruff.lint.per-file-ignores]
# A test that an argument is refused has to evaluate the expression on its own.
"tests/*" = ["B018", "B008"]
# Routes declare their query parameters and dependencies as call defaults.
# That is the framework calling convention and there is no other way to write it.
"src/drawbarline/api/*" = ["B008"]
# A migration is generated. Its imports are what the generator writes and a
# check constraint reads as one line of sql, which is easier to compare with
# the model it came from when it is not wrapped.
"migrations/*" = ["E501", "F401"]

[tool.ruff.lint.isort]
known-first-party = ["drawbarline"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
