[build-system]
requires = ["setuptools>=75.8.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "drawbarline"
version = "0.1.0"
description = "Car hire, demurrage and interchange settlement for a short line railroad"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "rkaushik-dev" }]
dependencies = [
  # zoneinfo reads the operating system database, which windows does not have.
  # Every hour we bill is local time at a station, so this is not optional there.
  "tzdata==2025.1 ; sys_platform == 'win32'",
  "SQLAlchemy==2.0.38",
]

[project.optional-dependencies]
dev = [
  "pytest==8.3.4",
  "ruff==0.9.6",
  "mypy==1.15.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "C4", "SIM", "RET"]

[tool.ruff.lint.per-file-ignores]
# A test that an argument is refused has to evaluate the expression on its own.
"tests/*" = ["B018"]

[tool.ruff.lint.isort]
known-first-party = ["drawbarline"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
