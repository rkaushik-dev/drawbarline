name: ci

on: [push, pull_request]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - run: ./gradlew --no-daemon spotlessCheck

  types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      # Every compile runs with -Xlint:all and -Werror, so a warning anywhere fails this job.
      - run: ./gradlew --no-daemon compileJava compileTestJava

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - run: ./gradlew --no-daemon test

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      # The floors are in build.gradle, so the number is the same here and on a desk.
      - run: ./gradlew --no-daemon test jacocoTestCoverageVerification
      - name: keep the coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: build/reports/jacoco/test
          if-no-files-found: ignore
          retention-days: 7

  migrations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      # The entities and the migrations have to describe the same schema, and the test that
      # proves it is worth its own job because it is the check that fails on somebody else's
      # machine rather than on the one that changed.
      - run: ./gradlew --no-daemon test --tests '*MigrationsTest'

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - run: ./gradlew --no-daemon installDist
      - name: run the installed command on its own
        run: build/install/drawbarline/bin/drawbarline --version
